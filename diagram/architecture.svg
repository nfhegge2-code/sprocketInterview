<svg width="820" height="700" viewBox="0 0 820 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; }
    .label { font-size: 11.5px; fill: #333; font-weight: 500; }
    .caption { font-size: 12px; fill: #444; }
  </style>
  <rect width="820" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- External: scanners -->
  <rect x="60" y="24" width="210" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="165" y="48" text-anchor="middle" class="title" fill="#712B13">Internet scanners / bots</text>
  <text x="165" y="67" text-anchor="middle" class="sub" fill="#993C1D">unsolicited traffic to :22</text>

  <!-- External: browser -->
  <rect x="550" y="24" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="655" y="48" text-anchor="middle" class="title" fill="#0C447C">You (browser)</text>
  <text x="655" y="67" text-anchor="middle" class="sub" fill="#185FA5">viewing the live map</text>

  <!-- Arrow labels sit right below the external boxes, well clear of the container title -->
  <rect x="180" y="94" width="62" height="20" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="211" y="108" text-anchor="middle" class="label">port 22</text>

  <rect x="580" y="94" width="76" height="20" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="618" y="108" text-anchor="middle" class="label">port 8000</text>

  <!-- Outer VPS container -->
  <rect x="60" y="150" width="700" height="390" rx="18" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="86" y="182" class="title" fill="#2C2C2A">VPS (Docker Compose host)</text>
  <text x="86" y="201" class="label" fill="#666">single box — see limitations in README</text>

  <!-- Honeypot container -->
  <rect x="96" y="228" width="300" height="140" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="246" y="256" text-anchor="middle" class="title" fill="#085041">Honeypot container</text>
  <text x="246" y="278" text-anchor="middle" class="sub" fill="#0F6E56">asyncio SSH listener</text>
  <text x="246" y="298" text-anchor="middle" class="sub" fill="#0F6E56">host 22 &#8594; container 2222</text>
  <text x="246" y="318" text-anchor="middle" class="sub" fill="#0F6E56">fake banner, logs every attempt</text>
  <text x="246" y="338" text-anchor="middle" class="sub" fill="#0F6E56">runs as non-root user</text>

  <!-- API container -->
  <rect x="424" y="228" width="300" height="140" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="574" y="256" text-anchor="middle" class="title" fill="#633806">API + frontend container</text>
  <text x="574" y="278" text-anchor="middle" class="sub" fill="#854F0B">FastAPI serves /api/attacks</text>
  <text x="574" y="298" text-anchor="middle" class="sub" fill="#854F0B">and /api/stats</text>
  <text x="574" y="318" text-anchor="middle" class="sub" fill="#854F0B">serves Leaflet map (static)</text>
  <text x="574" y="338" text-anchor="middle" class="sub" fill="#854F0B">port 8000</text>

  <!-- Shared volume -->
  <rect x="240" y="410" width="340" height="76" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="410" y="438" text-anchor="middle" class="title" fill="#26215C">Shared Docker volume</text>
  <text x="410" y="458" text-anchor="middle" class="sub" fill="#3C3489">SQLite: honeypot.db</text>

  <!-- External GeoIP -->
  <rect x="96" y="590" width="280" height="60" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="236" y="614" text-anchor="middle" class="title" fill="#712B13">ip-api.com</text>
  <text x="236" y="634" text-anchor="middle" class="sub" fill="#993C1D">free GeoIP lookup, cached in SQLite</text>

  <!-- Arrows: external -> containers -->
  <line x1="165" y1="80" x2="215" y2="226" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="655" y1="80" x2="595" y2="226" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Arrows: containers <-> shared volume -->
  <line x1="270" y1="368" x2="330" y2="410" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="272" y="378" width="52" height="20" rx="4" fill="#F1EFE8"/>
  <text x="298" y="392" text-anchor="middle" class="label">writes</text>

  <line x1="550" y1="410" x2="500" y2="368" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="500" y="378" width="112" height="20" rx="4" fill="#F1EFE8"/>
  <text x="556" y="392" text-anchor="middle" class="label">reads (read-only)</text>

  <!-- Arrow: honeypot -> geoip (external) -->
  <line x1="160" y1="368" x2="200" y2="588" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="146" y="466" width="82" height="20" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="187" y="480" text-anchor="middle" class="label">geo lookup</text>

  <!-- Legend / limitations -->
  <text x="60" y="672" class="caption" font-weight="600">Known limitations (see README):</text>
  <text x="60" y="690" class="caption">No network segmentation between containers &#8226; no log shipping off-box &#8226; single VPS = single point of failure</text>
</svg>
