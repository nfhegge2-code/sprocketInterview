<svg width="720" height="620" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; }
    .label { font-size: 11px; fill: #444; }
    .caption { font-size: 12px; fill: #444; }
  </style>
  <rect width="720" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- External: scanners -->
  <rect x="40" y="20" width="190" height="52" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="135" y="42" text-anchor="middle" class="title" fill="#712B13">Internet scanners / bots</text>
  <text x="135" y="60" text-anchor="middle" class="sub" fill="#993C1D">unsolicited traffic to :22</text>

  <!-- External: browser -->
  <rect x="490" y="20" width="190" height="52" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="585" y="42" text-anchor="middle" class="title" fill="#0C447C">You (browser)</text>
  <text x="585" y="60" text-anchor="middle" class="sub" fill="#185FA5">viewing the live map</text>

  <!-- Outer VPS container -->
  <rect x="40" y="110" width="640" height="330" rx="18" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="64" y="138" class="title" fill="#2C2C2A">VPS (Docker Compose host)</text>
  <text x="64" y="156" class="label">single box — see limitations below</text>

  <!-- Honeypot container -->
  <rect x="70" y="180" width="280" height="120" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="210" y="206" text-anchor="middle" class="title" fill="#085041">Honeypot container</text>
  <text x="210" y="226" text-anchor="middle" class="sub" fill="#0F6E56">asyncio SSH listener</text>
  <text x="210" y="244" text-anchor="middle" class="sub" fill="#0F6E56">host 22 &#8594; container 2222</text>
  <text x="210" y="262" text-anchor="middle" class="sub" fill="#0F6E56">fake banner, logs every attempt</text>
  <text x="210" y="280" text-anchor="middle" class="sub" fill="#0F6E56">runs as non-root user</text>

  <!-- API container -->
  <rect x="370" y="180" width="280" height="120" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="510" y="206" text-anchor="middle" class="title" fill="#633806">API + frontend container</text>
  <text x="510" y="226" text-anchor="middle" class="sub" fill="#854F0B">FastAPI serves /api/attacks</text>
  <text x="510" y="244" text-anchor="middle" class="sub" fill="#854F0B">and /api/stats</text>
  <text x="510" y="262" text-anchor="middle" class="sub" fill="#854F0B">serves Leaflet map (static)</text>
  <text x="510" y="280" text-anchor="middle" class="sub" fill="#854F0B">port 8000</text>

  <!-- Shared volume -->
  <rect x="210" y="330" width="300" height="72" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="360" y="358" text-anchor="middle" class="title" fill="#26215C">Shared Docker volume</text>
  <text x="360" y="378" text-anchor="middle" class="sub" fill="#3C3489">SQLite: honeypot.db (WAL mode)</text>

  <!-- External GeoIP -->
  <rect x="70" y="480" width="260" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="200" y="504" text-anchor="middle" class="title" fill="#712B13">ip-api.com</text>
  <text x="200" y="522" text-anchor="middle" class="sub" fill="#993C1D">free GeoIP lookup, cached in SQLite</text>

  <!-- Arrows -->
  <line x1="135" y1="72" x2="180" y2="178" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="150" y="130" class="label">port 22</text>

  <line x1="585" y1="72" x2="530" y2="178" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="550" y="130" class="label">port 8000</text>

  <line x1="230" y1="300" x2="290" y2="330" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="238" y="320" class="label">writes</text>

  <line x1="470" y1="330" x2="440" y2="300" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="440" y="320" class="label">reads (read-only)</text>

  <line x1="140" y1="300" x2="180" y2="480" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="145" y="400" class="label">geo lookup</text>

  <!-- Legend / limitations -->
  <text x="40" y="570" class="caption" font-weight="600">Known limitations (addressed in README):</text>
  <text x="40" y="588" class="caption">No network segmentation between honeypot and API container &#8226; no log shipping off-box &#8226;</text>
  <text x="40" y="604" class="caption">single VPS = single point of failure &#8226; GeoIP lookups are synchronous per-connection</text>
</svg>
